<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nativox Lip-Sync Evaluation</title>
<style>
body { font-family: Segoe UI, Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; background: #0f1419; color: #e6e6e6; }
h1 { margin-bottom: 4px; } .sub, .note { color: #9aa4ad; }
.card { background: #1a212a; border-radius: 10px; padding: 18px; margin-bottom: 18px; }
label { display: block; margin: 12px 0 4px; font-weight: 600; }
input[type=file] { width: 100%; padding: 8px; box-sizing: border-box; background: #0f1419; color: #e6e6e6; border: 1px solid #2f3a46; border-radius: 6px; }
button { margin-top: 18px; padding: 10px 22px; border: 0; border-radius: 6px; background: #3d9970; color: white; font-size: 16px; cursor: pointer; }
button:disabled { background: #4a5560; cursor: wait; } table { width: 100%; border-collapse: collapse; } th, td { padding: 10px; text-align: left; border-bottom: 1px solid #2f3a46; }
img, video { width: 100%; border-radius: 8px; margin-top: 10px; } #results { display: none; }
</style>
</head>
<body>
<h1>Lip-Sync Evaluation</h1>
<div class="sub">Compare real Hindi mouth movement with dubbed videos</div>
<form id="form" class="card">
  <label for="real">1. Real Hindi video</label><input type="file" id="real" accept="video/*" required>
  <label for="dubbed">2. Dubbed video (no lip-sync)</label><input type="file" id="dubbed" accept="video/*" required>
  <label for="lipsync">3. Dubbed + Wav2Lip video (optional)</label><input type="file" id="lipsync" accept="video/*">
  <button type="submit" id="btn">Compare</button><div id="status" class="note"></div>
</form>
<div id="results">
  <div class="card"><h3>Scores</h3><table><thead><tr><th>Video</th><th>Correlation</th><th>Stretched correlation</th><th>Error</th><th>Delay</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="card"><h3>Mouth movement graph</h3><img id="plot" alt="Comparison graph"></div>
  <div class="card" id="videoCard"><h3>Side by side</h3><video id="video" controls></video></div>
</div>
<script>
const form = document.getElementById("form"), btn = document.getElementById("btn"), status = document.getElementById("status");
form.addEventListener("submit", async (event) => {
  event.preventDefault(); const data = new FormData();
  data.append("real", document.getElementById("real").files[0]);
  data.append("dubbed", document.getElementById("dubbed").files[0]);
  const lip = document.getElementById("lipsync").files[0]; if (lip) data.append("lipsync", lip);
  btn.disabled = true; status.textContent = "Analysing... this can take a minute.";
  try {
    const response = await fetch("/api/compare", { method: "POST", body: data });
    const json = await response.json(); if (!response.ok) throw new Error(json.detail || "Something went wrong");
    const rows = document.getElementById("rows"); rows.replaceChildren();
    for (const [name, score] of Object.entries(json.results)) {
      const row = document.createElement("tr");
      [name, score.correlation, score.dtw_correlation, score.error, `${score.delay_ms} ms`].forEach(value => {
        const cell = document.createElement("td"); cell.textContent = value; row.append(cell);
      }); rows.append(row);
    }
    const stamp = `?t=${Date.now()}`; document.getElementById("plot").src = json.plot + stamp;
    const card = document.getElementById("videoCard"); card.style.display = json.video ? "block" : "none";
    if (json.video) document.getElementById("video").src = json.video + stamp;
    document.getElementById("results").style.display = "block"; status.textContent = "Done.";
  } catch (error) { status.textContent = `Error: ${error.message}`; } finally { btn.disabled = false; }
});
</script>
</body>
</html>
